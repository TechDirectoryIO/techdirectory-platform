# B46 order Worker (Cloudflare free plan). No secrets in this file.
# Keys live in Cloudflare's Secrets Store (account level) and are bound below, or as Worker secrets
# (npx wrangler secret put <NAME>). The code accepts either.
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, TD_API_KEY, WEB_RISK_KEY (optional: link safety works without it),
#   COPYSCAPE_USER, COPYSCAPE_KEY, INDEXNOW_KEY, BREVO_API_KEY, ADMIN_TOKEN (40+ random characters)
name = "td-b46-orders"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# If techdirectory.io is in TechDirectory's Cloudflare account, use a custom domain instead:
# routes = [{ pattern = "orders.techdirectory.io", custom_domain = true }]

[[kv_namespaces]]
binding = "ORDERS"
id = "SET_AT_GO_LIVE"   # npx wrangler kv namespace create ORDERS

[vars]
SITE_URL = "https://www.techdirectory.io"
WORKER_URL = "SET_AT_GO_LIVE"          # this Worker's own address
ALLOWED_ORIGIN = "https://www.techdirectory.io"
PRICE_USD = "SET_AT_GO_LIVE"           # Stripe price IDs for $199 / £159 / €185
PRICE_GBP = "SET_AT_GO_LIVE"
PRICE_EUR = "SET_AT_GO_LIVE"
PRICE_PR_USD = "SET_AT_GO_LIVE"        # press release (Announcement Plus) $349 / £279 / €325
PRICE_PR_GBP = "SET_AT_GO_LIVE"
PRICE_PR_EUR = "SET_AT_GO_LIVE"
PR_WEEKLY_CAP = "15"
TD_PR_PATH = "/press-releases/"
WEEKLY_CAP = "15"
TD_POST_TYPE_ID = "SET_AT_GO_LIVE"     # TD post type for sponsored posts
TD_AUTHOR_USER_ID = "SET_AT_GO_LIVE"   # TD account that owns sponsored posts
TD_POST_PATH = "/sponsored/"
ORIGINALITY_CHECK = "off"             # owner, 30 Oct 2026: own content only, buyer confirms; "on" needs Copyscape keys
ORIGINALITY_FAIL_PCT = "40"            # match elsewhere at or above this: refund
ORIGINALITY_FLAG_PCT = "10"            # at or above this: owner's queue
OWNER_EMAIL = "SET_AT_GO_LIVE"
SENDER_EMAIL = "info@techdirectory.io"

# Secrets Store bindings (store ID from the Secrets Store page; the secret names match the code)
# [[secrets_store_secrets]]
# binding = "BREVO_API_KEY"
# store_id = "SET_AT_GO_LIVE"
# secret_name = "BREVO_API_KEY"
# (repeat for WEB_RISK_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, TD_API_KEY, INDEXNOW_KEY, ADMIN_TOKEN)
